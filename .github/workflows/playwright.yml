name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
      SITE_BASIC_USER: ${{ secrets.SITE_BASIC_USER }}
      SITE_BASIC_PASSWORD: ${{ secrets.SITE_BASIC_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - name: Check MailSlurp configuration
      run: |
        if [ -z "$MAILSLURP_API_KEY" ]; then
          echo "::error::MAILSLURP_API_KEY is not configured in GitHub Actions secrets."
          exit 1
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
